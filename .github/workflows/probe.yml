name: 調査用（審議中継サイトの取得）

# 審議中継などのページを GitHub のサーバーから取得し、結果を probe/ に保存する（調査用）。
on:
  workflow_dispatch:
    inputs:
      script:
        description: "実行するコマンド（bash）。出力先は $OUT"
        required: true

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4
      - name: 道具
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q yt-dlp requests
      - name: 実行
        run: |
          export OUT="probe/${{ github.run_id }}"
          mkdir -p "$OUT"
          cat > "$OUT/script.sh" <<'EOS'
          ${{ inputs.script }}
          EOS
          bash "$OUT/script.sh" > "$OUT/log.txt" 2>&1 || echo "exit $?" >> "$OUT/log.txt"
          tail -50 "$OUT/log.txt"
      - name: 保存
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe
          git commit -qm "調査 ${{ github.run_id }}" || true
          git pull --rebase -q && git push -q
